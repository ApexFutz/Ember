name: CI

# Verifies the app builds from a clean checkout with NO .env — i.e. the
# "clone and run" zero-setup guarantee keeps working (the shared public
# Supabase default must be baked into the bundle).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ember
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # npm install (not ci): package-lock.json can lag package.json, and this
        # mirrors exactly what a "clone and run" user does.
        run: npm install

      - name: Build (no .env present)
        run: npm run build

      - name: Verify zero-setup Supabase default is bundled
        run: |
          if grep -rq "vfcetqmbghkrlqmmtrkb.supabase.co" dist/assets/*.js; then
            echo "✓ shared backend default embedded — clone-and-run works"
          else
            echo "✗ default Supabase URL missing from bundle — clone-and-run is broken"
            exit 1
          fi
