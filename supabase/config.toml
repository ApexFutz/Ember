# Minimal Supabase CLI config. Generated for migration tooling.
project_id = "ember"

[db]
# Port used by `supabase start` for the local Postgres (Docker). Not required for
# `supabase db push` against the linked remote.
port = 54322
major_version = 15

# Called by database webhooks (pg_net), not end users — it guards itself with a
# shared secret (NOTIFY_WEBHOOK_SECRET) and serves a public unsubscribe GET.
[functions.send-notification-email]
verify_jwt = false
